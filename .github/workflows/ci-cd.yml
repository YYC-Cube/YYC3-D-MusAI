name: MusAI CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

env:
  NODE_VERSION: "20"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, backend, mobile-app]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install sub-project dependencies
        working-directory: ${{ matrix.project }}
        run: npm install --legacy-peer-deps
        if: matrix.project != 'frontend'

      - name: Run ESLint
        working-directory: ${{ matrix.project }}
        run: npx eslint . --ext .ts,.tsx --report-unused-disable-directives --max-warnings 10 2>/dev/null || true
        continue-on-error: true

      - name: Run TypeScript type check
        working-directory: ${{ matrix.project }}
        run: npx tsc --noEmit

  unit-tests:
    name: Unit Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: always() && needs.lint-and-typecheck.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, backend, mobile-app]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install sub-project dependencies
        working-directory: ${{ matrix.project }}
        run: npm install --legacy-peer-deps
        if: matrix.project != 'frontend'

      - name: Frontend Tests
        if: matrix.project == 'frontend'
        working-directory: frontend
        run: npx vitest run --coverage

      - name: Backend Tests
        if: matrix.project == 'backend'
        working-directory: backend
        run: npx jest --coverage --passWithNoTests
        env:
          JWT_SECRET: test_jwt_secret_key_minimum_32_characters_long_for_ci
          NODE_ENV: test

      - name: Mobile Tests
        if: matrix.project == 'mobile-app'
        working-directory: mobile-app
        run: npm test -- --no-coverage --testPathIgnorePatterns=e2e

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main' && needs.unit-tests.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test --project=chromium
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Dependency audit
        run: |
          cd frontend && npm audit --audit-level=high --production 2>/dev/null || true
          cd ../backend && npm audit --audit-level=high --production 2>/dev/null || true
        continue-on-error: true

      - name: Snyk scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Secret detection
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true

  build-and-deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.ref == 'refs/heads/main' && needs.unit-tests.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://d-music.yyc3.top/api
          VITE_WS_URL: wss://d-music.yyc3.top
          VITE_APP_NAME: MusAI
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
