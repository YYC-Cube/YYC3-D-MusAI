name: MusAI CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

env:
  NODE_VERSION: "20"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, backend, mobile-app]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install all workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        working-directory: ${{ matrix.project }}
        run: npx tsc --noEmit

      - name: Run ESLint
        if: matrix.project != 'mobile-app'
        working-directory: ${{ matrix.project }}
        run: npx eslint . --ext .ts,.tsx

  unit-tests:
    name: Unit Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: always()
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, backend, mobile-app]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install all workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend Tests (vitest)
        if: matrix.project == 'frontend'
        working-directory: frontend
        run: npx vitest run --coverage

      - name: Backend Tests (jest)
        if: matrix.project == 'backend'
        working-directory: backend
        run: npx jest --no-cache --maxWorkers=2
        env:
          JWT_SECRET: test_jwt_secret_key_minimum_32_characters_long_for_ci
          NODE_ENV: test

      - name: Mobile Tests (jest)
        if: matrix.project == 'mobile-app'
        working-directory: mobile-app
        run: npm test -- --testPathIgnorePatterns=e2e

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=critical

      - name: Snyk scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Secret detection
        uses: trufflesecurity/trufflehog@main

  build-and-deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Ensure GitHub Pages exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pages" 2>/dev/null || \
          gh api "repos/${{ github.repository }}/pages" -X POST -f build_type=workflow || true

      - name: Install all workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://music.0379.world/musai/api
          VITE_SOCKET_URL: wss://music.0379.world/musai
          VITE_APP_NAME: MusAI
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
